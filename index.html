<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163d35">
  <meta name="description" content="웅상 QR ON 영업신고와 위생 관련 안내를 한곳에서 확인하세요.">
  <title>웅상 QR ON | 영업정보 안내</title>
  <style>
    :root { 
      color-scheme: light;
      --ink: #1e302c;
      --muted: #667671;
      --line: #d9e1dc;
      --paper: #f4f7f2;
      --surface: #fff;
      --green: #244d40;
      --green-soft: #e5efe7;
      --lime: #d9ed9b;
      --orange: #c65d3d;
      --shadow: 0 16px 40px rgb(25 54 46 / 8%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      line-height: 1.55;
    }

    button, input { font: inherit; }

    .masthead {
      position: relative;
      overflow: hidden;
      background: #eaf2e3;
      color: var(--green);
    }

    .masthead::after {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 37%;
      height: 100%;
      background: repeating-linear-gradient(135deg, transparent 0 28px, rgb(36 77 64 / 3%) 28px 29px);
      content: "";
      pointer-events: none;
    }

    .topbar, .hero, .page, .footer-inner {
      width: min(1160px, calc(100% - 48px));
      margin-inline: auto;
    }

    .topbar {
      display: flex;
      min-height: 74px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgb(36 77 64 / 14%);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: inherit;
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--green);
      border-radius: 9px;
      background: var(--green);
      color: var(--lime);
      font-size: 12px;
      letter-spacing: 0;
    }

    .topbar-note {
      color: #526960;
      font-size: 13px;
    }

    .hero {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 302px;
      grid-template-columns: minmax(0, 1fr) 430px;
      align-items: center;
      gap: 28px;
      padding-block: 34px 46px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--orange);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
    }

    h1 {
      max-width: 680px;
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.25;
      letter-spacing: 0;
    }

    .hero-copy {
      max-width: 590px;
      margin: 14px 0 0;
      color: #536961;
      font-size: 15px;
    }

    .hero-characters {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 260px;
      overflow: hidden;
      border-bottom: 2px solid rgb(36 77 64 / 22%);
      background: linear-gradient(180deg, transparent 0 78%, rgb(213 232 206 / 58%) 78% 100%);
    }

    .hero-characters::before {
      position: absolute;
      right: 8%;
      bottom: 16%;
      left: 8%;
      height: 1px;
      background: rgb(36 77 64 / 22%);
      content: "";
    }

    .mascot {
      position: absolute;
      bottom: 18px;
      display: block;
      width: 23%;
      aspect-ratio: 1;
      margin: 0;
      overflow: hidden;
      border: 2px solid #fff;
      border-radius: 12px;
      background: #fff;
      animation: mascot-in 600ms both;
      box-shadow: 0 8px 18px rgb(27 60 48 / 12%);
    }

    .mascot img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .mascot figcaption {
      position: absolute;
      right: 0;
      bottom: 4px;
      left: 0;
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      text-align: center;
    }
    .mascot--ppuyong { left: 1%; animation-delay: 60ms; }
    .mascot--hoit { left: 25%; animation-delay: 130ms; }
    .mascot--geumi { left: 49%; animation-delay: 200ms; }
    .mascot--maerong { right: 1%; animation-delay: 270ms; }

    .character-caption {
      position: absolute;
      z-index: 2;
      top: 7px;
      right: 4px;
      padding: 6px 10px;
      border: 1px solid rgb(36 77 64 / 13%);
      border-radius: 4px;
      background: #fffdf4;
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
    }

    @keyframes mascot-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page {
      position: relative;
      z-index: 2;
      margin-top: -28px;
      padding-bottom: 72px;
    }

    .search-wrap {
      display: flex;
      min-height: 68px;
      align-items: center;
      gap: 14px;
      padding: 10px 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .search-icon {
      display: grid;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      place-items: center;
      border: 2px solid var(--orange);
      border-radius: 50%;
    }

    .search-icon::after {
      width: 8px;
      height: 2px;
      margin: 16px 0 0 16px;
      background: var(--orange);
      content: "";
      transform: rotate(45deg);
      transform-origin: left center;
    }

    .search-wrap input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
    }

    .search-wrap input::placeholder { color: #87938e; }

    .content-grid {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 28px;
      margin-top: 28px;
    }

    .menu-panel, .content-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .menu-panel {
      align-self: start;
      padding: 22px 14px;
    }

    .panel-label {
      margin: 0 10px 13px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .menu-list { display: grid; gap: 4px; }

    .menu-button {
      display: grid;
      width: 100%;
      grid-template-columns: 30px 1fr 12px;
      align-items: center;
      gap: 8px;
      padding: 12px 10px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }

    .menu-button:hover { background: #f2f6f2; }
    .menu-button[aria-current="page"] { background: var(--green-soft); color: var(--green); font-weight: 800; }

    .menu-number {
      color: #84918b;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .menu-button[aria-current="page"] .menu-number { color: var(--orange); }

    .menu-arrow {
      width: 7px;
      height: 7px;
      border-top: 1.5px solid currentColor;
      border-right: 1.5px solid currentColor;
      transform: rotate(45deg);
    }

    .content-panel { min-height: 440px; padding: 30px 34px 34px; }

    .content-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 23px;
      border-bottom: 1px solid var(--line);
    }

    .content-heading h2 { margin: 0; font-size: 25px; line-height: 1.35; letter-spacing: 0; }
    .content-description { margin: 8px 0 0; color: var(--muted); font-size: 14px; }

    .item-count {
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 4px;
      background: #f1f4f1;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .topic-list { display: grid; }

    .topic {
      border-bottom: 1px solid var(--line);
    }

    .topic:last-child { border-bottom: 0; }

    .topic-toggle {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 21px 3px;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }

    .topic-toggle:hover .topic-title { color: var(--orange); }
    .topic-title { font-size: 16px; font-weight: 700; }

    .topic-plus {
      position: relative;
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      border: 1px solid #bdc9c2;
      border-radius: 50%;
    }

    .topic-plus::before, .topic-plus::after {
      position: absolute;
      top: 9px;
      left: 6px;
      width: 8px;
      height: 1px;
      background: var(--green);
      content: "";
    }

    .topic-plus::after { transform: rotate(90deg); transition: transform 160ms ease; }
    .topic-toggle[aria-expanded="true"] .topic-plus::after { transform: rotate(0); }

    .topic-detail {
      margin: -8px 28px 20px 3px;
      color: var(--muted);
      font-size: 14px;
    }

    .empty-state {
      padding: 44px 12px;
      color: var(--muted);
      text-align: center;
    }

    .notice {
      display: flex;
      gap: 12px;
      margin-top: 22px;
      padding: 15px 18px;
      border-left: 3px solid var(--orange);
      background: #fff8f3;
      color: #64554d;
      font-size: 13px;
    }

    .notice strong { flex: 0 0 auto; color: #9d4e32; }

    footer {
      border-top: 1px solid var(--line);
      background: #edf2ed;
    }

    .footer-inner {
      display: flex;
      min-height: 76px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    .footer-brand { color: var(--green); font-weight: 800; }

    @media (max-width: 760px) {
      .topbar, .hero, .page, .footer-inner { width: min(100% - 32px, 600px); }
      .topbar { min-height: 62px; }
      .topbar-note { font-size: 11px; }
      .hero { min-height: unset; grid-template-columns: 1fr; gap: 12px; padding-block: 28px 42px; }
      .hero-copy { font-size: 14px; }
      .hero-characters { width: min(100%, 390px); height: 188px; margin: 4px auto 0; }
      .mascot { bottom: 16px; width: 22%; border-radius: 9px; }
      .mascot figcaption { bottom: 3px; font-size: 10px; }
      .character-caption { top: 2px; right: 0; font-size: 10px; }
      .page { margin-top: -24px; padding-bottom: 48px; }
      .search-wrap { min-height: 60px; padding-inline: 15px; }
      .content-grid { grid-template-columns: 1fr; gap: 14px; margin-top: 16px; }
      .menu-panel { padding: 15px 12px; }
      .panel-label { margin-bottom: 9px; }
      .menu-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .menu-button { grid-template-columns: 24px 1fr; gap: 5px; min-height: 52px; padding: 9px 8px; font-size: 13px; }
      .menu-arrow { display: none; }
      .content-panel { min-height: 360px; padding: 23px 19px; }
      .content-heading h2 { font-size: 21px; }
      .topic-toggle { padding-block: 18px; }
      .topic-title { font-size: 14px; }
      .notice { display: block; }
      .notice strong { display: block; margin-bottom: 3px; }
      .footer-inner { align-items: flex-start; flex-direction: column; justify-content: center; gap: 3px; padding-block: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="topbar">
      <a class="brand" href="#top" aria-label="웅상 QR ON 첫 화면">
        <span class="brand-mark" aria-hidden="true">QR</span>
        <span>웅상 QR ON</span>
      </a>
      <span class="topbar-note">영업신고 · 위생정보 안내</span>
    </div>
    <div class="hero" id="top">
      <div>
        <p class="eyebrow">BUSINESS GUIDE / UNGSANG</p>
        <h1>영업신고, 필요한 정보를<br>한곳에서 확인하세요.</h1>
        <p class="hero-copy">신규 신고부터 시설기준, 위생교육까지. 웅상 QR ON에서 영업에 필요한 안내를 찾아보세요.</p>
      </div>
      <div class="hero-characters" aria-label="양산시 관광 캐릭터 양산프렌즈">
        <span class="character-caption">양산프렌즈와 함께 알아보는 영업정보</span>
        <figure class="mascot mascot--ppuyong"><img src="https://www.yangsan.go.kr/tour/img/sub/01/char1_1.png" alt="뿌용 캐릭터"><figcaption>뿌용</figcaption></figure>
        <figure class="mascot mascot--hoit"><img src="https://www.yangsan.go.kr/tour/img/sub/01/char2_1.png" alt="호잇 캐릭터"><figcaption>호잇</figcaption></figure>
        <figure class="mascot mascot--geumi"><img src="https://www.yangsan.go.kr/tour/img/sub/01/char3_1.png" alt="금이 캐릭터"><figcaption>금이</figcaption></figure>
        <figure class="mascot mascot--maerong"><img src="https://www.yangsan.go.kr/tour/img/sub/01/char4_1.png" alt="매롱 캐릭터"><figcaption>매롱</figcaption></figure>
      </div>
    </div>
  </header>

  <main class="page">
    <label class="search-wrap">
      <span class="search-icon" aria-hidden="true"></span>
      <input id="menu-search" type="search" placeholder="궁금한 메뉴를 검색하세요" autocomplete="off" aria-label="안내 메뉴 검색">
    </label>

    <div class="content-grid">
      <nav class="menu-panel" aria-label="영업정보 메뉴">
        <p class="panel-label">MENU</p>
        <div class="menu-list" id="menu-list"></div>
      </nav>

      <section class="content-panel" id="content-panel" aria-live="polite"></section>
    </div>

    <aside class="notice">
      <strong>안내</strong>
      <span>세부 기준과 제출 서류는 업종 및 영업 형태에 따라 달라질 수 있습니다. 실제 신고 전 최신 기준과 관할 기관의 안내를 확인해 주세요.</span>
    </aside>
  </main>

  <footer>
    <div class="footer-inner">
      <span class="footer-brand">웅상 QR ON</span>
      <span>Copyright &copy; 2026 웅상보건소. All rights reserved.</span>
    </div>
  </footer>

  <script>
    const menus = [
      {
        title: "구비서류 안내",
        description: "신규 영업신고와 변경·승계·폐업 등 신고 유형별 구비서류를 확인하세요.",
        items: [
          { title: "업종별 신규 영업신고 (식품·공중)", detail: "식품 관련 업종과 공중위생 업종의 신규 영업신고에 필요한 서류와 절차를 안내합니다. 업종별 세부 항목은 신고 전 관할 기관에 확인해 주세요." },
          { title: "공통 신고사항 (지위승계·변경·폐업 등)", detail: "영업자 지위승계, 신고사항 변경, 폐업 등 영업 중 발생하는 주요 신고 유형을 확인할 수 있습니다." },
          { title: "면허 발급 (조리사·이용사·미용사)", detail: "조리사·이용사·미용사 면허 발급과 관련한 기본 안내를 제공합니다. 자격 및 제출 서류는 발급기관의 최신 안내를 확인해 주세요." }
        ]
      },
      {
        title: "업종별 시설기준 (식품·공중)",
        description: "업종에 따라 달라지는 영업장 시설기준을 확인하세요.",
        items: [
          { title: "식품 관련 업종 시설기준", detail: "식품 관련 영업의 업종별 시설기준을 확인할 수 있도록 안내합니다. 적용 기준은 업종과 영업 형태에 따라 달라질 수 있습니다." },
          { title: "공중위생 업종 시설기준", detail: "공중위생 관련 업종의 영업장 시설기준을 살펴보세요. 실제 시설 준비 전 최신 법령과 담당 기관의 안내를 확인해 주세요." }
        ]
      },
      {
        title: "위생교육 안내",
        description: "영업자 위생교육의 대상과 이수 관련 정보를 확인하세요.",
        items: [
          { title: "신규 영업자 위생교육", detail: "영업을 새로 시작하는 경우 필요한 위생교육 정보를 안내합니다. 교육 대상, 일정, 신청 방법은 업종별 교육기관의 공지를 확인해 주세요." },
          { title: "기존 영업자 위생교육", detail: "기존 영업자의 정기 위생교육 관련 안내입니다. 이수 주기와 교육 방식은 해당 업종의 최신 기준을 확인해 주세요." }
        ]
      },
      {
        title: "온라인 민원 접수 / 정보안내",
        description: "온라인 민원 접수와 영업 관련 정보를 확인할 수 있는 안내입니다.",
        items: [
          { title: "온라인 민원 접수", detail: "온라인으로 이용할 수 있는 민원 접수 경로와 준비사항을 안내합니다. 접수 가능한 민원 종류와 처리 절차는 공식 민원 창구에서 확인해 주세요." },
          { title: "영업 관련 정보안내", detail: "영업신고와 운영에 참고할 수 있는 관련 정보와 공식 안내 경로를 제공합니다." }
        ]
      },
      {
        title: "관련 법령",
        description: "영업자 준수사항과 위반 시 행정처분 기준을 살펴보세요.",
        items: [
          { title: "영업자 준수사항", detail: "영업자가 알아두어야 할 주요 준수사항을 확인할 수 있도록 안내합니다. 정확한 의무사항은 업종별 현행 법령을 기준으로 확인해 주세요." },
          { title: "위반 시 행정처분 기준", detail: "위반 유형에 따른 행정처분 기준을 확인할 수 있도록 관련 정보를 안내합니다. 실제 처분은 구체적인 사실관계와 적용 법령에 따라 달라집니다." }
        ]
      }
    ];

    const menuList = document.querySelector("#menu-list");
    const contentPanel = document.querySelector("#content-panel");
    const searchInput = document.querySelector("#menu-search");
    let selectedIndex = 0;

    function render() {
      const query = searchInput.value.trim().toLocaleLowerCase("ko");
      const visibleMenus = menus
        .map((menu, index) => {
          const menuMatches = `${menu.title} ${menu.description}`.toLocaleLowerCase("ko").includes(query);
          return {
            ...menu,
            index,
            menuMatches,
            visibleItems: menu.items.filter((item) => !query || menuMatches || `${item.title} ${item.detail}`.toLocaleLowerCase("ko").includes(query))
          };
        })
        .filter((menu) => !query || menu.menuMatches || menu.visibleItems.length > 0);

      if (!visibleMenus.some((menu) => menu.index === selectedIndex)) {
        selectedIndex = visibleMenus[0]?.index ?? -1;
      }

      menuList.innerHTML = visibleMenus.map((menu) => `
        <button class="menu-button" type="button" data-index="${menu.index}" aria-current="${menu.index === selectedIndex ? "page" : "false"}">
          <span class="menu-number">${String(menu.index + 1).padStart(2, "0")}</span>
          <span>${menu.title}</span>
          <span class="menu-arrow" aria-hidden="true"></span>
        </button>
      `).join("");

      menuList.querySelectorAll(".menu-button").forEach((button) => {
        button.addEventListener("click", () => {
          selectedIndex = Number(button.dataset.index);
          render();
        });
      });

      const selectedMenu = visibleMenus.find((menu) => menu.index === selectedIndex);
      if (!selectedMenu) {
        contentPanel.innerHTML = `<div class="empty-state">검색 결과가 없습니다.<br>다른 단어로 다시 검색해 주세요.</div>`;
        return;
      }

      const shownItems = query ? selectedMenu.visibleItems : selectedMenu.items;
      contentPanel.innerHTML = `
        <div class="content-heading">
          <div>
            <p class="eyebrow" style="color: var(--orange)">GUIDE ${String(selectedIndex + 1).padStart(2, "0")}</p>
            <h2>${selectedMenu.title}</h2>
            <p class="content-description">${selectedMenu.description}</p>
          </div>
          <span class="item-count">${shownItems.length}개 안내</span>
        </div>
        <div class="topic-list">
          ${shownItems.map((item, index) => `
            <article class="topic">
              <button class="topic-toggle" type="button" aria-expanded="false" aria-controls="topic-${selectedIndex}-${index}">
                <span class="topic-title">${item.title}</span>
                <span class="topic-plus" aria-hidden="true"></span>
              </button>
              <p class="topic-detail" id="topic-${selectedIndex}-${index}" hidden>${item.detail}</p>
            </article>
          `).join("")}
        </div>
      `;

      contentPanel.querySelectorAll(".topic-toggle").forEach((button) => {
        button.addEventListener("click", () => {
          const detail = document.getElementById(button.getAttribute("aria-controls"));
          const expanded = button.getAttribute("aria-expanded") === "true";
          button.setAttribute("aria-expanded", String(!expanded));
          detail.hidden = expanded;
        });
      });
    }

    searchInput.addEventListener("input", () => {
      selectedIndex = -1;
      render();
    });

    render();
  </script>
</body>
</html>
