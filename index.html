<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR_ON! - 인허가 원스톱 통합 안내</title>
  <!-- FontAwesome & Pretendard 폰트 불러오기 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-family-pretendard/1.3.8/static/pretendard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #0F172A; /* 고급스러운 네이비 */
      --accent: #2563EB;  /* 원스톱 블루 */
      --secondary: #059669; /* 신뢰 초록 */
      --bg: #F1F5F9;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --sub-text: #475569;
      --border: #E2E8F0;
    }

    * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; }

    /* 헤더 브랜딩 (QR_ON!) */
    header { background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); color: white; padding: 24px 20px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
    .logo-tag { display: inline-flex; align-items: center; gap: 8px; background: rgba(37, 99, 235, 0.3); border: 1px solid var(--accent); color: #60A5FA; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; }
    header h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
    header p { font-size: 0.85rem; color: #94A3B8; margin-top: 6px; }

    .main-container { max-width: 840px; margin: 0 auto; padding: 16px; }

    /* 1. 통합 검색창 */
    .search-card { background: var(--card-bg); padding: 20px; border-radius: 16px; margin-top: -15px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid var(--border); position: relative; }
    .search-input-wrapper { position: relative; }
    .search-input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--accent); font-size: 1.1rem; }
    .search-input { width: 100%; padding: 14px 16px 14px 48px; border: 2px solid var(--border); border-radius: 12px; font-size: 0.95rem; font-weight: 600; outline: none; transition: 0.2s; }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    
    /* 검색 연관 드롭다운 */
    .search-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border); border-radius: 12px; margin-top: 6px; max-height: 250px; overflow-y: auto; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: none; }
    .search-item { padding: 12px 16px; border-bottom: 1px solid #F1F5F9; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .search-item:hover { background: #EFF6FF; }
    .search-item .badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 4px; font-weight: 700; }
    .badge-food { background: #FEF3C7; color: #D97706; }
    .badge-health { background: #DCFCE7; color: #15803D; }
    .badge-public { background: #E0E7FF; color: #4338CA; }

    /* 2. 대분류 카테고리 (3대 법령 구분) */
    .section-title { font-size: 1rem; font-weight: 800; color: var(--primary); margin: 24px 0 12px 0; display: flex; align-items: center; gap: 8px; }
    .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .cat-card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 14px; padding: 16px 10px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .cat-card i { font-size: 1.8rem; margin-bottom: 8px; display: block; color: var(--sub-text); }
    .cat-card strong { display: block; font-size: 0.9rem; color: var(--text); }
    .cat-card span { font-size: 0.72rem; color: var(--sub-text); margin-top: 2px; display: block; }
    .cat-card.active { border-color: var(--accent); background: #EFF6FF; }
    .cat-card.active i, .cat-card.active strong { color: var(--accent); }

    /* 3. 세부 업종 선택 드롭다운 */
    .sub-biz-area { display: none; margin-top: 16px; background: white; padding: 16px; border-radius: 12px; border: 1px solid var(--border); }
    .sub-biz-area label { font-size: 0.85rem; font-weight: 700; color: var(--sub-text); display: block; margin-bottom: 8px; }
    .sub-select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.95rem; font-weight: 700; color: var(--primary); outline: none; }

    /* 4. 원스톱 안내 카드 (결과) */
    .result-container { display: none; margin-top: 24px; animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .result-header-card { background: var(--primary); color: white; padding: 20px; border-radius: 16px 16px 0 0; display: flex; justify-content: space-between; align-items: center; }
    .result-header-card h2 { font-size: 1.2rem; font-weight: 800; }
    .result-header-card .law-tag { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }

    .result-content { background: white; border: 1px solid var(--border); border-top: none; border-radius: 0 0 16px 16px; padding: 20px; }

    /* 4개 탭 구분 */
    .info-tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
    .tab-btn { padding: 10px 14px; font-size: 0.88rem; font-weight: 700; color: var(--sub-text); border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; margin-bottom: -2px; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .pane { display: none; line-height: 1.6; font-size: 0.9rem; }
    .pane.active { display: block; }
    .pane h4 { color: var(--primary); font-size: 0.95rem; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .pane ul { padding-left: 20px; color: var(--sub-text); }
    .pane ul li { margin-bottom: 8px; }

    /* 서식 다운로드 버튼 스타일 */
    .form-download-btn { display: inline-flex; align-items: center; gap: 8px; background: #F0F9FF; border: 1px solid #BAE6FD; color: #0284C7; padding: 10px 14px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: 700; margin-top: 12px; }
    .form-download-btn:hover { background: #E0F2FE; }

    /* 모바일 대응 */
    @media (max-width: 600px) {
      .category-grid { grid-template-columns: 1fr; }
      .cat-card { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 16px; }
      .cat-card i { font-size: 1.4rem; margin-bottom: 0; }
    }
  </style>
</head>
<body>

  <!-- 상단 브랜딩 -->
  <header>
    <div class="logo-tag"><i class="fa-solid fa-qrcode"></i> 스마트 민원 네비게이션</div>
    <h1>QR_ON! 인허가 원스톱 안내</h1>
    <p>식품위생법 · 건강기능식품법 · 공중위생관리법을 한눈에 찾기</p>
  </header>

  <div class="main-container">

    <!-- 1. 키워드 통합 검색 -->
    <div class="search-card">

      </div>
      <div id="searchDropdown" class="search-dropdown"></div>
    </div>

    <!-- 2. 카테고리 선택 (3대 법령) -->
    <div class="section-title">
      <i class="fa-solid fa-layer-group" style="color: var(--accent);"></i> 사업 분야를 선택하세요
    </div>
    
    <div class="category-grid">
      <div class="cat-card" onclick="selectCategory('food', this)">
        <i class="fa-solid fa-utensils"></i>
        <div>
          <strong>식품 / 음식점</strong>
          <span>식품위생법 8대 영업</span>
        </div>
      </div>
      <div class="cat-card" onclick="selectCategory('health', this)">
        <i class="fa-solid fa-capsules"></i>
        <div>
          <strong>건강기능식품</strong>
          <span>제조업 · 판매업</span>
        </div>
      </div>
      <div class="cat-card" onclick="selectCategory('public', this)">
        <i class="fa-solid fa-pump-soap"></i>
        <div>
          <strong>공중위생 업종</strong>
          <span>미용 · 숙박 · 세탁 · 청소</span>
        </div>
      </div>
    </div>

    <!-- 3. 세부 업종 선택 영역 -->
    <div id="subBizArea" class="sub-biz-area">
      <label id="subBizLabel">상세 업종 선택</label>
      <select id="subBizSelect" class="sub-select" onchange="renderResult(this.value)">
        <!-- 자바스크립트로 동적 로드 -->
      </select>
    </div>

    <!-- 4. 원스톱 결과 표시 -->
    <div id="resultContainer" class="result-container">
      <div class="result-header-card">
        <div>
          <h2 id="resBizName">업종 명칭</h2>
          <span id="resLawTag" class="law-tag">적용 법률</span>
        </div>
        <div style="font-size: 1.8rem; opacity: 0.8;" id="resIcon"><i class="fa-solid fa-store"></i></div>
      </div>

      <div class="result-content">
        <!-- 4대 안내 탭 -->
        <div class="info-tabs">
          <button class="tab-btn active" onclick="switchTab(this, 'tab-docs')"><i class="fa-solid fa-file-lines"></i> 구비서류 & 서식</button>
          <button class="tab-btn" onclick="switchTab(this, 'tab-facility')"><i class="fa-solid fa-ruler-combined"></i> 시설기준</button>
          <button class="tab-btn" onclick="switchTab(this, 'tab-edu')"><i class="fa-solid fa-graduation-cap"></i> 위생교육</button>
          <button class="tab-btn" onclick="switchTab(this, 'tab-rules')"><i class="fa-solid fa-triangle-exclamation"></i> 영업자 준수사항</button>
        </div>

        <!-- 탭 1: 구비서류 -->
        <div id="tab-docs" class="pane active">
          <h4><i class="fa-solid fa-check-circle" style="color: var(--accent);"></i> 인허가 신청 시 필요 서류</h4>
          <ul id="resDocsList"></ul>
          <a id="resFormLink" href="#" target="_blank" class="form-download-btn">
            <i class="fa-solid fa-file-arrow-down"></i> 법제처/정부24 표준 신청서식 보기
          </a>
        </div>

        <!-- 탭 2: 시설기준 -->
        <div id="tab-facility" class="pane">
          <h4><i class="fa-solid fa-building" style="color: var(--accent);"></i> 업종별 필수 시설 조건</h4>
          <ul id="resFacilityList"></ul>
        </div>

        <!-- 탭 3: 위생교육 -->
        <div id="tab-edu" class="pane">
          <h4><i class="fa-solid fa-user-graduate" style="color: var(--accent);"></i> 위생교육 기관 및 안내</h4>
          <div id="resEduBox" style="background:#F8FAFC; padding:14px; border-radius:10px; border:1px solid var(--border);"></div>
        </div>

        <!-- 탭 4: 준수사항 -->
        <div id="tab-rules" class="pane">

          <ul id="resRulesList"></ul>
        </div>

      </div>
    </div>

  </div>

    let currentCat = '';

    // 1. 카테고리 클릭 선택
    function selectCategory(cat, el) {
      currentCat = cat;
      document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');

      const filtered = db.filter(item => item.cat === cat);
      const select = document.getElementById('subBizSelect');
      
      select.innerHTML = '<option value="">-- 원하시는 상세 업종을 선택하세요 --</option>' + 
        filtered.map(i => `<option value="${i.id}">${i.name}</option>`).join('');

      document.getElementById('subBizArea').style.display = 'block';
      document.getElementById('resultContainer').style.display = 'none';
    }

    // 2. 키워드 검색 처리
    function onSearchInput(val) {
      const dropdown = document.getElementById('searchDropdown');
      const query = val.trim().toLowerCase();

      if (!query) {
        dropdown.style.display = 'none';
        return;
      }

      const matches = db.filter(item => 
        item.name.toLowerCase().includes(query) || 
        item.keywords.some(k => k.toLowerCase().includes(query))
      );

      if (matches.length > 0) {
        dropdown.innerHTML = matches.map(m => `
          <div class="search-item" onclick="selectFromSearch('${m.id}')">
            <div>
              <strong style="font-size:0.9rem; color:var(--primary);">${m.name}</strong>
              <div style="font-size:0.75rem; color:var(--sub-text);">${m.law}</div>
            </div>
            <span class="badge ${m.badge}">${m.cat === 'food' ? '식품' : m.cat === 'health' ? '건기식' : '공중위생'}</span>
          </div>
        `).join('');
        dropdown.style.display = 'block';
      } else {
        dropdown.innerHTML = `<div class="search-item" style="color:var(--sub-text); font-size:0.85rem;">검색된 업종이 없습니다.</div>`;
        dropdown.style.display = 'block';
      }
    }

    function selectFromSearch(id) {
      document.getElementById('searchDropdown').style.display = 'none';
      document.getElementById('searchInput').value = '';
      renderResult(id);
    }

    // 3. 최종 원스톱 결과 출력
    function renderResult(id) {
      const item = db.find(i => i.id === id);
      if (!item) return;

      document.getElementById('resBizName').innerText = item.name;
      document.getElementById('resLawTag').innerText = item.law;
      document.getElementById('resIcon').innerHTML = `<i class="fa-solid ${item.icon}"></i>`;

      // 구비서류
      document.getElementById('resDocsList').innerHTML = item.docs.map(d => `<li>${d}</li>`).join('');
      document.getElementById('resFormLink').href = item.formUrl;

      // 시설기준
      document.getElementById('resFacilityList').innerHTML = item.facility.map(f => `<li>${f}</li>`).join('');

      // 위생교육
      document.getElementById('resEduBox').innerHTML = `
        <strong style="color:var(--accent);">${item.edu}</strong><br>
        <span style="font-size:0.82rem; color:var(--sub-text);">신규 영업 전 또는 매년 정기교육 이수 필수</span>
      `;

      // 준수사항
      document.getElementById('resRulesList').innerHTML = item.rules.map(r => `<li>${r}</li>`).join('');

      document.getElementById('resultContainer').style.display = 'block';
      
      // 결과 카드로 스크롤 이동
      document.getElementById('resultContainer').scrollIntoView({ behavior: 'smooth' });
    }

    // 탭 전환
    function switchTab(btn, paneId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
      document.getElementById(paneId).classList.add('active');
    }
  </script>
