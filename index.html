<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="description" content="양산시 위생 인·허가 원스톱 안내. 내 가게에 필요한 서류와 서식을 한 화면에서 확인하세요.">
  <title>QR_ON! 내 손안의 든든한 영업 파트너 | 양산시 위생 인·허가 안내</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-gov-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --ink: #14233B;
      --primary: #16325C;
      --accent: #1F5FAE;
      --accent-strong: #174C8F;
      --accent-soft: #EAF2FB;
      --sun: #F4B400;
      --sun-soft: #FFF6D9;
      --sun-line: #EED48A;
      --green: #1E8A5F;
      --danger: #C62D2D;
      --bg: #F5F7FA;
      --card: #FFFFFF;
      --text: #1B2533;
      --sub: #4A5566;
      --muted: #6B7686;
      --border: #DCE2EA;
      --line: #E8ECF2;
      --r-lg: 20px;
      --r-md: 14px;
      --r-sm: 10px;
      --font: "Pretendard GOV Variable", "Pretendard GOV", "Pretendard Variable", Pretendard, "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-padding-top: 70px; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 17px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
    button, input { font-family: inherit; font-size: inherit; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid #8BB8F0; outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 18px; }

    /* ── 첫 화면 머리 ── */
    .hero { position: relative; overflow: hidden; background: var(--accent); color: #FFFFFF; padding: 26px 18px 70px; text-align: center; }
    .hero::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.13) 1.6px, transparent 1.7px); background-size: 18px 18px; -webkit-mask-image: linear-gradient(115deg, transparent 35%, #000 100%); mask-image: linear-gradient(115deg, transparent 35%, #000 100%); pointer-events: none; }
    .hero > * { position: relative; }
    .hero-tag { display: inline-flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.14); padding: 5px 13px; border-radius: 999px; font-size: 0.82rem; font-weight: 700; margin-bottom: 12px; }
    .hero-tag i { color: var(--sun); }
    .brand-row { display: flex; align-items: flex-end; justify-content: center; gap: 10px; }
    .brand-row .mascots { display: flex; align-items: flex-end; gap: 2px; }
    .brand-row img { display: block; width: 44px; height: auto; }
    .hero h1 { font-size: clamp(2.4rem, 8vw, 3.2rem); font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
    .hero h1 span { color: var(--sun); }
    .hero-sub { margin-top: 10px; font-size: 1.12rem; font-weight: 800; }

    /* ── 다른 화면의 윗줄 ── */
    .topbar { position: sticky; top: 0; z-index: 20; background: var(--primary); color: #FFFFFF; }
    .topbar-inner { max-width: 720px; margin: 0 auto; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .topbar a, .topbar button { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: transparent; color: #FFFFFF; font-size: 0.92rem; font-weight: 700; text-decoration: none; cursor: pointer; }
    .topbar .logo { border: none; font-size: 1.15rem; font-weight: 900; letter-spacing: -0.03em; padding: 6px 4px; }
    .topbar .logo span { color: var(--sun); }

    main { padding-bottom: 40px; }
    .pull-up { margin-top: -48px; position: relative; }
    .card { background: var(--card); border-radius: var(--r-lg); border: 1px solid var(--border); padding: 20px; }
    .pull-up .card { border: none; box-shadow: 0 10px 30px rgba(20, 35, 59, 0.12); }
    .q-title { font-size: 1.35rem; font-weight: 800; color: var(--primary); letter-spacing: -0.02em; margin-bottom: 14px; }
    .q-help { color: var(--sub); font-size: 0.95rem; margin: -8px 0 14px; }
    .section { margin-top: 18px; }

    /* 큰 선택 버튼 */
    .big-list { display: grid; gap: 10px; }
    .big-btn { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: var(--r-md); background: #FFFFFF; color: var(--text); text-decoration: none; text-align: left; cursor: pointer; }
    .big-btn:hover { border-color: var(--accent); background: #FBFDFF; }
    .big-btn .ic { display: grid; place-items: center; flex: 0 0 46px; width: 46px; height: 46px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-size: 1.25rem; }
    .big-btn strong { display: block; font-size: 1.12rem; font-weight: 800; }
    .big-btn small { display: block; color: var(--muted); font-size: 0.86rem; }
    .big-btn .go { margin-left: auto; color: var(--accent); }
    .big-btn.soft .ic { background: var(--sun-soft); color: #9A6A00; }

    /* 검색 */
    .search { position: relative; }
    .search i.fa-magnifying-glass { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--accent); }
    .search input { width: 100%; padding: 15px 14px 15px 46px; border: 2px solid #B9C6D6; border-radius: var(--r-md); font-weight: 600; background: #FFFFFF; color: var(--text); outline: none; }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(31,95,174,0.15); }
    .search-results { margin-top: 8px; display: grid; gap: 6px; }
    .search-results a { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--accent-soft); text-decoration: none; }
    .search-results a strong { color: var(--primary); }
    .search-results a small { display: block; color: var(--muted); font-size: 0.8rem; }
    .search-empty { margin-top: 8px; color: var(--sub); font-size: 0.92rem; }
    .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.85rem; margin: 16px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    /* 업종 타일 */
    .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 92px; padding: 10px 6px; border: 1.5px solid var(--border); border-radius: var(--r-md); background: #FFFFFF; color: var(--text); text-decoration: none; text-align: center; font-weight: 700; font-size: 0.98rem; line-height: 1.3; cursor: pointer; }
    .tile i { font-size: 1.5rem; color: var(--accent); }
    .tile:hover { border-color: var(--accent); background: #FBFDFF; }
    .all-list summary { cursor: pointer; padding: 14px 16px; border: 1.5px dashed var(--border); border-radius: var(--r-md); font-weight: 700; color: var(--accent); list-style: none; text-align: center; }
    .all-list summary::-webkit-details-marker { display: none; }
    .all-group { margin-top: 16px; }
    .all-group h3 { font-size: 0.95rem; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
    .all-group a { display: block; padding: 12px 14px; border-bottom: 1px solid var(--line); text-decoration: none; }
    .all-group a strong { display: block; color: var(--text); font-size: 1rem; }
    .all-group a small { display: block; color: var(--muted); font-size: 0.84rem; }

    /* ── 결과 화면 ── */
    .result-head { background: var(--primary); color: #FFFFFF; padding: 20px 18px 56px; }
    .result-head .wrap { padding: 0; }
    .crumb { display: inline-block; background: rgba(255,255,255,0.14); padding: 4px 11px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; color: #FFE7A3; }
    .result-head h1 { margin-top: 8px; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.35; }
    .result-head p { margin-top: 6px; color: #DCE8F7; font-size: 0.95rem; }
    .task-chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 14px; padding-bottom: 2px; scrollbar-width: none; }
    .task-chips::-webkit-scrollbar { display: none; }
    .task-chips a { flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.35); color: #FFFFFF; text-decoration: none; font-size: 0.9rem; font-weight: 700; }
    .task-chips a[aria-current="page"] { background: #FFFFFF; color: var(--primary); border-color: #FFFFFF; }

    .checklist-title { display: flex; align-items: center; gap: 8px; font-size: 1.3rem; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
    .checklist-title i { color: var(--green); }
    .checklist-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
    .checklist { list-style: none; display: grid; gap: 8px; }
    .checklist label { display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: var(--r-sm); cursor: pointer; background: #FFFFFF; }
    .checklist input { flex: 0 0 22px; width: 22px; height: 22px; margin-top: 2px; accent-color: var(--green); }
    .checklist input:checked + span { color: var(--muted); text-decoration: line-through; }
    .checklist label:has(input:checked) { background: #F4FAF7; border-color: #BFE3D0; }
    .doc-link { color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
    .doc-link i { margin-left: 5px; font-size: 0.78em; }
    .fold { margin-top: 10px; border: 1px solid var(--border); border-radius: var(--r-sm); background: #FFFFFF; }
    .fold summary { cursor: pointer; padding: 12px 14px; font-weight: 700; color: var(--primary); font-size: 0.95rem; }
    .fold[open] summary { border-bottom: 1px solid var(--line); }
    .fold-body { padding: 12px 14px; font-size: 0.93rem; color: var(--sub); }
    .fold-body ul { padding-left: 18px; }
    .fold-body li + li { margin-top: 5px; }
    .fold-body p + p, .fold-body p + .btn-row, .fold-body ul + .btn-row, .fold-body ul + p { margin-top: 10px; }

    .meta-row { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); font-size: 0.95rem; }
    .meta-row strong { color: var(--primary); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 16px; border-radius: var(--r-sm); border: 1.5px solid var(--accent); background: #FFFFFF; color: var(--accent); text-decoration: none; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
    .btn:hover { background: var(--accent-soft); }
    .btn.solid { background: var(--accent); color: #FFFFFF; }
    .btn.solid:hover { background: var(--accent-strong); }

    .caution { margin-top: 14px; border-radius: var(--r-lg); background: var(--sun-soft); border: 1.5px solid var(--sun-line); padding: 18px 20px; color: #4D3A00; }
    .caution h2 { display: flex; align-items: center; gap: 8px; font-size: 1.12rem; font-weight: 800; margin-bottom: 10px; }
    .caution h2 i { color: #B88300; }
    .caution-item + .caution-item { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--sun-line); }
    .caution-item strong { display: block; font-size: 1rem; }
    .caution-item p { font-size: 0.92rem; margin-top: 2px; }
    .law-checks { list-style: none; margin-top: 8px; display: grid; gap: 6px; }
    .law-checks li { font-size: 0.92rem; padding: 9px 11px; background: rgba(255,255,255,0.7); border-radius: 8px; }
    .law-checks b { display: inline-block; margin-right: 6px; padding: 1px 7px; border-radius: 5px; background: var(--primary); color: #FFFFFF; font-size: 0.75rem; }
    .law-checks small { display: block; color: #7A6320; font-size: 0.8rem; margin-top: 2px; }
    .law-checks a { color: #7A6320; }

    .more h2 { font-size: 1.12rem; font-weight: 800; color: var(--primary); margin: 26px 0 8px; }
    .annex-original-card { padding: 4px 0; }
    .annex-tag { display: inline-block; margin-bottom: 6px; padding: 2px 9px; border-radius: 6px; background: var(--primary); color: #FFFFFF; font-size: 0.76rem; font-weight: 700; }
    .annex-original-card strong { display: block; color: var(--primary); }
    .annex-original-card p { margin-top: 4px; }
    .annex-original-card b { color: var(--accent); }
    .form-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .form-link-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 9px 14px; border: 1.5px solid var(--accent); border-radius: var(--r-sm); background: #FFFFFF; color: var(--accent); text-decoration: none; font-weight: 700; font-size: 0.92rem; }

    .share-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #FFFFFF; padding: 10px 16px; border-radius: 999px; font-size: 0.92rem; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
    .toast.show { opacity: 1; }

    .provider { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .provider:last-child { border-bottom: none; }
    .provider h3 { font-size: 1.02rem; color: var(--primary); }
    .provider p { font-size: 0.88rem; color: var(--muted); margin-top: 2px; }
    .note { color: var(--muted); font-size: 0.86rem; margin-top: 12px; }

    /* ── 바닥글 ── */
    .site-footer { background: var(--ink); color: #B8C4D4; margin-top: 30px; }
    .site-footer-inner { max-width: 720px; margin: 0 auto; padding: 26px 18px 32px; font-size: 0.85rem; }
    .footer-org { color: #FFFFFF; font-size: 1rem; font-weight: 800; }
    .footer-note { margin-top: 8px; }
    .footer-laws { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; }
    .footer-laws a { color: #C9D4E3; text-underline-offset: 2px; }
    .character-credit { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.12); color: #8E9BAD; font-size: 0.76rem; }
    .character-credit a { color: #C9D4E3; }

    @media (max-width: 520px) {
      body { font-size: 16.5px; }
      .wrap { padding: 0 14px; }
      .brand-row img { width: 30px; }
      .card { padding: 18px 15px; }
      .tiles { gap: 8px; }
      .tile { min-height: 84px; font-size: 0.92rem; }
      .result-head h1 { font-size: 1.3rem; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>

    };

    const GC_DOCS = {

      succession: ['집단급식소 설치·운영자 지위승계 신고서', '지위승계 사유를 증명하는 서류', '기존 집단급식소 설치·운영신고증', '위생교육이수증(교육 대상자)', '건강진단결과서(보건증, 건강진단 대상자)'],
      closure: ['집단급식소 설치·운영 종료신고서', '기존 집단급식소 설치·운영신고증(발급받은 경우)']
    };
    function getDocs(item, task) {
      const guide = legalGuides[item.lawKey];
      const gc = item.id === 'food_group_catering';
      if (task === 'new') return { docs: item.docs, extra: item.conditionalDocuments || [], typeSpecific: item.typeSpecificDocuments || [] };
      if (task === 'reissue') return { docs: ['재발급신청서', '기존 영업신고증(훼손된 경우)'], extra: [], typeSpecific: [] };
      const map = { change: 'changeDocuments', succession: 'succession', closure: 'closureDocuments' };
      return { docs: gc ? GC_DOCS[task] : guide[map[task]], extra: [], typeSpecific: [] };

    // ── 수수료 ──
    function getFee(item, task) {
      if (item.lawKey !== 'food') return task === 'closure' ? null : '관할 기관에 확인하세요';
      if (item.id === 'food_group_catering') return task === 'new' ? '면제 규정이 있어요(시행규칙 제94조제2항 해당 시)' : '관할 기관에 확인하세요';
      return {
        new: item.id === 'food_temp_instant' ? '방문·우편 9,300원 (전자민원 8,300원)' : '방문·우편 28,000원',
        change: '주소 변경 26,500원, 그 밖의 변경 9,300원 (방문·우편)',
        succession: '9,300원 (방문·우편)',
        closure: '없음',
        reissue: null
      }[task];

    // ── 작은 도우미 ──
    function formLinkText(text, form) {
      if (!form || !form.url) return text;
      const attrs = form.download ? 'download' : 'target="_blank"';
      return `<a class="doc-link" href="${form.url}" ${attrs} rel="noopener noreferrer">${text}<i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a>`;
    }
    function formButton(form) {
      if (!form) return '';
      const attrs = form.download ? 'download' : 'target="_blank"';
      const icon = form.download ? 'fa-download' : 'fa-file-lines';
      const text = form.download ? '한글파일 내려받기' : '서식 보기·내려받기';
      const pdfButton = form.pdfUrl
        ? `<a class="btn" href="${form.pdfUrl}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-file-pdf"></i> PDF 바로 확인</a>`
        : '';
      return `<div class="fold-body" style="padding:12px 0 0;"><strong style="color:var(--primary);font-size:0.92rem;">${form.label}</strong>
        <div class="btn-row" style="margin-top:6px;"><a class="btn" href="${form.url}" ${attrs} rel="noopener noreferrer"><i class="fa-solid ${icon}"></i> ${text}</a>${pdfButton}</div></div>`;
    }
    function checklistHTML(items) {
      return `<ul class="checklist">${items.map(text => `<li><label><input type="checkbox"><span>${text}</span></label></li>`).join('')}</ul>`;
    }
    const AGENT_FOLD = `
      <details class="fold">
        <summary>대리인이 오거나 법인 명의로 신청한다면</summary>
        <div class="fold-body">
          <ul>
            <li><strong>대리인이 올 때:</strong> 모든 신고서에 신고인 자필서명, 자필서명한 신고인 신분증 사본, 위임장, 대리인 신분증. 신고인이 인감도장을 찍는 경우 인감증명서</li>
            <li><strong>법인 명의일 때:</strong> 법인등기부등본(말소사항 포함), 법인인감증명서(사용인감 사용 시 사용인감계), 법인인감</li>
            <li><strong>법인 대리인이 올 때:</strong> 법인인감을 찍은 위임장과 대리인 신분증. 법인인감이 필요한 경우 일반 도장으로 대신할 수 없어요.</li>
          </ul>
          <div class="btn-row"><a class="btn" href="https://www.law.go.kr/법령별표서식/(민원처리에관한법률시행규칙,서식3)" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-file-lines"></i> 위임장 서식 보기·내려받기</a></div>
        </div>
      </details>`;

    function topbar() {
      return `<div class="topbar"><div class="topbar-inner">
        <button type="button" onclick="goBack()" aria-label="이전 화면"><i class="fa-solid fa-arrow-left"></i> 이전</button>
        <a class="logo" href="#">QR_ON<span>!</span></a>
        <a href="#" aria-label="처음 화면"><i class="fa-solid fa-house"></i> 처음</a>
      </div></div>`;
    }
    function goBack() {
      if (history.length > 1) history.back(); else location.hash = '';
    }
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }
    function copyLink() {
      const url = location.href;
      const done = () => showToast('안내 주소를 복사했어요');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done).catch(() => window.prompt('이 주소를 복사하세요', url));
      } else {
        window.prompt('이 주소를 복사하세요', url);
      }
    }
    function shareRow() {
      return `<div class="share-row">
        <button type="button" class="btn" onclick="copyLink()"><i class="fa-solid fa-link"></i> 이 안내 주소 복사</button>
        <a class="btn" href="#"><i class="fa-solid fa-house"></i> 처음으로</a>
      </div>`;
    }

    // ── 검색 ──
    function searchItems(query, task) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      const bizMatches = db.filter(item => isAvailable(task || 'new', item) && (
        item.name.toLowerCase().includes(q) ||
        item.keywords.some(k => k.toLowerCase().includes(q)) ||
        (popularLabel(item.id) || '').includes(q)
      ));
      const licenseMatches = task ? [] : licenseDb.filter(item => item.name.includes(q) || item.keywords.some(k => k.includes(q)));
      return [...bizMatches.map(item => ({ item, href: `#${task || 'new'}/${item.id}` })), ...licenseMatches.map(item => ({ item, href: `#license/${item.id}` }))];
    }
    function onSearch(input, task) {
      const box = document.getElementById('searchResults');
      const results = searchItems(input.value, task);
      if (!input.value.trim()) { box.innerHTML = ''; return; }
      box.innerHTML = results.length
        ? `<div class="search-results">${results.slice(0, 8).map(({ item, href }) => {
            const out = item.id === 'food_truck_add';
            return `<a href="${out ? item.govUrl : href}" ${out ? 'target="_blank" rel="noopener noreferrer"' : ''}><span><strong>${item.name}</strong><small>${item.type || (businessDefinitions[item.id] || '')}</small></span><i class="fa-solid fa-chevron-right" style="color:var(--accent)"></i></a>`;
          }).join('')}</div>`
        : `<p class="search-empty">찾는 업종이 없어요. 다른 이름으로 검색하거나 아래에서 골라 보세요.</p>`;
    }
    function searchBox(task, placeholder) {
      return `<div class="search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <label class="sr-only" for="searchInput">업종 이름 검색</label>
        <input id="searchInput" type="search" autocomplete="off" placeholder="${placeholder}" oninput="onSearch(this, ${task ? `'${task}'` : 'null'})">
      </div><div id="searchResults"></div>`;
    }

        <main class="wrap">
          <div class="pull-up"><section class="card" aria-labelledby="homeQ">

              ${MAIN_TASKS.map(key => `
                <a class="big-btn" href="#${key}"><span class="ic"><i class="fa-solid ${TASKS[key].icon}"></i></span>
                  <span><strong>${TASKS[key].label}</strong><small>${TASKS[key].legal}</small></span><i class="fa-solid fa-chevron-right go"></i></a>`).join('')}
              <a class="big-btn soft" href="#more"><span class="ic"><i class="fa-solid fa-id-card"></i></span>
                <span><strong>면허·위생교육·보건증</strong><small>조리사·이미용 면허, 교육기관, 보건증 발급</small></span><i class="fa-solid fa-chevron-right go"></i></a>

    function viewPicker(task) {
      const t = TASKS[task];
      const popular = POPULAR.filter(p => isAvailable(task, findBiz(p.id)));

      return `${topbar()}

          <div class="tiles">
            ${popular.map(p => `<a class="tile" href="#${task}/${p.id}"><i class="fa-solid ${p.icon}" aria-hidden="true"></i>${p.label}</a>`).join('')}
          </div>
          <details class="all-list section">
            <summary>여기에 없어요. 모든 업종 보기</summary>

              <div class="all-group"><h3>${g.title}</h3>

              </div>`).join('')}
          </details>

    function cautionHTML(item, task) {
      const gc = item.id === 'food_group_catering';
      const parts = [];
      const lawKeys = otherLawByBusiness[item.id] || [];
      if (task === 'new' && lawKeys.length) {
        parts.push(`<div class="caution-item"><strong>계약 전에 다른 법령도 확인하세요</strong>
          <p>건물이나 장소가 다른 법령에 맞지 않으면 신고할 수 없어요. 임대차 계약이나 공사 전에 각 담당 부서에 확인하세요.</p>
          <ul class="law-checks">${lawKeys.map(key => {
            const c = otherLawChecks[key];
            return `<li><b>${c.law}</b>${c.check}<small>확인처: ${c.where} · <a href="${c.url}" target="_blank" rel="noopener noreferrer">법령 원문</a></small></li>`;
          }).join('')}</ul></div>`);
      }
      if (task === 'change' && lawKeys.length) {
        parts.push(`<div class="caution-item"><strong>가게 주소를 옮긴다면</strong><p>새 장소도 건물 용도 등 다른 법령에 맞는지 계약 전에 확인하세요.</p></div>`);
      }
      if (task === 'succession') {
        parts.push(`<div class="caution-item"><strong>넘겨받기 전에 행정처분 이력을 확인하세요</strong><p>이전 영업자가 받은 행정처분이나 진행 중인 처분의 효과는 넘겨받는 사람에게 이어질 수 있어요.</p></div>`);

      return `<section class="caution" aria-labelledby="cautionTitle"><h2 id="cautionTitle"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> 꼭 확인하세요</h2>${parts.join('')}</section>`;

      const forms = getForms(item);

      let online = '';
      if (task === 'new' && item.id === 'food_temp_instant') online = `<a class="btn solid" href="${item.govUrl}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-arrow-up-right-from-square"></i> 정부24에서 신청하기</a>`;
      if (task === 'closure') { const s = getClosureGovService(item, guide); online = `<a class="btn solid" href="${s.url}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-arrow-up-right-from-square"></i> ${s.label}</a>`; }

      const chips = Object.keys(TASKS).filter(key => isAvailable(key, item)).map(key =>
        `<a href="#${key}/${item.id}" ${key === task ? 'aria-current="page"' : ''}>${taskName(key, item, 'short')}</a>`).join('');
      const eduSector = item.lawKey === 'public' ? 'public' : 'food';
      const eduText = item.lawKey === 'food'
        ? '식품 영업자는 위생교육을 받아야 해요. 새로 여는 분은 원칙적으로 영업 시작 전에, 기존 영업자는 매년 받아야 합니다.'

          <span class="crumb">${taskName(task, item)}</span>

            ${checklistHTML(list)}
            ${typeSpecific.length ? `<details class="fold"><summary>업종 유형별 서류</summary><div class="fold-body"><ul>${typeSpecific.map(d => `<li>${d}</li>`).join('')}</ul></div></details>` : ''}
            ${extra.length ? `<details class="fold"><summary>해당되는 경우에만 추가로 내는 서류</summary><div class="fold-body"><ul>${extra.map(d => `<li>${d}</li>`).join('')}</ul></div></details>` : ''}
            ${AGENT_FOLD}
            ${mainForm ? formButton(mainForm) : (task === 'reissue' ? '<p class="note">재발급 신청서는 관할 기관에 문의하세요.</p>' : '')}
            ${task === 'succession' ? formButton(TRANSFER_FORM) : ''}
            <div class="meta-row">

              <div class="btn-row"><a class="btn" href="#edu/${eduSector}"><i class="fa-solid fa-graduation-cap"></i> 위생교육 받을 곳 찾기</a></div></div></details>
            <details class="fold"><summary>관련 법령</summary><div class="fold-body"><div class="btn-row" style="margin-top:0;">
              ${guide.sources.map(([name, url]) => `<a class="btn" href="${url}" target="_blank" rel="noopener noreferrer">${name}</a>`).join('')}
            </div></div></details>
          </section>
          <p class="note">최종 제출서류는 업종과 관할 기관에 따라 다를 수 있어요. 신청 전 관할 시·군·구에 확인하세요.</p>
          ${shareRow()}
        </main>`;
      return html;
    }

    function fillResultFolds(task, item) {
      const annexes = item.lawKey === 'food' ? foodAnnexReferences[item.id] : null;
      const facility = document.getElementById('foldFacility');
      const rules = document.getElementById('foldRules');
      if (annexes) {
        if (facility) renderAnnexOriginal('foldFacility', annexes.facility, item.name);
        renderAnnexOriginal('foldRules', annexes.rules, item.name);
      } else {
        if (facility) facility.innerHTML = item.facility.map(f => `<p>${f}</p>`).join('');
        rules.innerHTML = item.rules.map(r => `<p>${r}</p>`).join('');
      }
    }

    function viewMore() {
      return `${topbar()}
        <main class="wrap" style="padding-top:18px;">
          <h1 class="q-title">무엇이 필요하세요?</h1>
          <div class="big-list">
            ${licenseDb.map(l => `<a class="big-btn" href="#license/${l.id}"><span class="ic"><i class="fa-solid fa-id-card"></i></span><span><strong>${l.name} 발급</strong><small>처음 발급, 다시 발급</small></span><i class="fa-solid fa-chevron-right go"></i></a>`).join('')}
            <a class="big-btn" href="#edu"><span class="ic"><i class="fa-solid fa-graduation-cap"></i></span><span><strong>위생교육 받을 곳 찾기</strong><small>업종별 교육기관 바로가기</small></span><i class="fa-solid fa-chevron-right go"></i></a>
            <a class="big-btn soft" href="${HEALTH_CERT_URL}" target="_blank" rel="noopener noreferrer"><span class="ic"><i class="fa-solid fa-file-medical"></i></span><span><strong>보건증 온라인 발급</strong><small>보건소에서 검사받았다면 다시 오지 않고 스마트폰으로 받으세요</small></span><i class="fa-solid fa-arrow-up-right-from-square go"></i></a>
            <a class="big-btn" href="#reissue"><span class="ic"><i class="fa-solid fa-rotate"></i></span><span><strong>영업신고증 다시 받기</strong><small>잃어버리거나 훼손된 경우</small></span><i class="fa-solid fa-chevron-right go"></i></a>
          </div>
        </main>`;
    }

    function viewLicense(item) {
      const chips = licenseDb.map(l => `<a href="#license/${l.id}" ${l.id === item.id ? 'aria-current="page"' : ''}>${l.name}</a>`).join('');
      const issue = item.issueDocs.map((d, i) => i === 0 ? formLinkText(d, item.issueForm) : d);
      const reissue = item.reissueDocs.map((d, i) => i === 0 ? formLinkText(d, item.reissueForm) : d);
      return `${topbar()}
        <div class="result-head"><div class="wrap">
          <span class="crumb">면허 발급</span>
          <h1>${item.name}</h1>
          <p>${item.type}</p>
          <nav class="task-chips" aria-label="다른 면허">${chips}</nav>
        </div></div>
        <main class="wrap">
          <div class="pull-up" style="margin-top:-36px;"><section class="card">
            <h2 class="checklist-title"><i class="fa-solid fa-clipboard-check" aria-hidden="true"></i> 처음 발급받을 때</h2>
            ${checklistHTML(issue)}
            ${formButton(item.issueForm)}
          </section></div>
          <section class="card section">
            <h2 class="checklist-title"><i class="fa-solid fa-rotate" aria-hidden="true"></i> 다시 발급받을 때</h2>
            ${checklistHTML(reissue)}
            ${formButton(item.reissueForm)}
          </section>
          <section class="caution"><h2><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> 꼭 확인하세요</h2>
            ${item.notes.map(n => `<div class="caution-item"><p>${n}</p></div>`).join('')}
          </section>
          <p class="note">${item.sources.map(([name, url]) => `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:var(--accent);font-weight:700;">${name} 원문</a>`).join(' · ')}</p>
          ${shareRow()}
        </main>`;
    }

    function viewEdu(sector) {
      if (!sector) {
        return `${topbar()}
          <main class="wrap" style="padding-top:18px;">
            <h1 class="q-title">어떤 업종의 위생교육인가요?</h1>
            <p class="q-help">영업신고증에 적힌 업종을 확인하고 고르세요.</p>
            <div class="big-list">
              <a class="big-btn" href="#edu/food"><span class="ic"><i class="fa-solid fa-utensils"></i></span><span><strong>음식점·식품·건강기능식품</strong><small>식당, 카페, 제과, 반찬가게, 제조·판매, 급식</small></span><i class="fa-solid fa-chevron-right go"></i></a>
              <a class="big-btn" href="#edu/public"><span class="ic"><i class="fa-solid fa-pump-soap"></i></span><span><strong>미용·이용·숙박·목욕·세탁</strong><small>공중위생 영업</small></span><i class="fa-solid fa-chevron-right go"></i></a>
            </div>
          </main>`;
      }
      const categories = hygieneEducationCategories[sector];
      return `${topbar()}
        <main class="wrap" style="padding-top:18px;">
          <p class="crumb" style="background:var(--accent-soft);color:var(--accent);">위생교육 받을 곳</p>
          <h1 class="q-title" style="margin-top:10px;">${sector === 'food' ? '음식점·식품·건강기능식품' : '미용·이용·숙박·목욕·세탁'}</h1>
          <p class="q-help">내 업종을 찾아 교육기관으로 이동하세요. 여러 곳이 있으면 그중 한 곳에서 받으면 돼요.</p>
          <section class="card">
            ${categories.map(c => `
              <div class="provider"><h3>${c.business}</h3>
                ${c.providers.some(p => p.notice) ? `<p>${c.providers.filter(p => p.notice).map(p => p.notice).join(' ')}</p>` : ''}
                <div class="btn-row">${c.providers.map(p => `<a class="btn" href="${p.url}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-arrow-up-right-from-square"></i> ${p.name}${p.scope ? ` (${p.scope})` : ''}</a>`).join('')}</div>
              </div>`).join('')}
          </section>
          <p class="note">교육 대상과 시기, 교육시간은 법령과 지정 고시에 따라요. 업종이 여러 개이거나 교육기관이 헷갈리면 관할 기관에 확인하세요.</p>
          ${shareRow()}
        </main>`;
    }

    // ───────────── 주소(#)에 따라 화면 바꾸기 ─────────────
    function route() {
      const app = document.getElementById('app');
      const [head, sub] = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/');
      let afterRender = null;
      if (TASKS[head] && sub && isAvailable(head, findBiz(sub))) {
        const item = findBiz(sub);
        if (item.id === 'food_truck_add') { location.hash = 'change'; return; }
        app.innerHTML = viewResult(head, item);
        afterRender = () => fillResultFolds(head, item);
        document.title = `${popularLabel(item.id) || item.name} ${taskName(head, item)} | QR_ON!`;
      } else if (TASKS[head]) {
        app.innerHTML = viewPicker(head);
        document.title = `${TASKS[head].label} | QR_ON!`;
      } else if (head === 'more') {
        app.innerHTML = viewMore();
      } else if (head === 'license' && licenseDb.some(l => l.id === sub)) {
        app.innerHTML = viewLicense(licenseDb.find(l => l.id === sub));
      } else if (head === 'edu') {
        app.innerHTML = viewEdu(sub === 'food' || sub === 'public' ? sub : null);
      } else {
        app.innerHTML = viewHome();
        document.title = 'QR_ON! 내 손안의 든든한 영업 파트너 | 양산시 위생 인·허가 안내';
      }
      if (afterRender) afterRender();
      window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>
